<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Module Configurator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .center {
            display: flex;
            justify-content: center;
        }
        label, button {
            cursor: pointer;
        }
        td:first-child {
            width: 100%;
            border-right: 1rem solid transparent;
        }
        td:not(:last-child) {
            border-bottom: .5rem solid transparent;
        }
    </style>
</head>
<body>
    <form action="/" method="post">
        <fieldset>
            <legend>WiFi Settings</legend>
            <table>
                <tr>
                    <td>
                        <label for="wifi_host">Hostname</label>
                    </td>
                    <td>
                        <input type="text" id="wifi_host" name="wifi_host">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="wifi_ssid">SSID</label>
                    </td>
                    <td>
                        <input type="text" id="wifi_ssid" name="wifi_ssid">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="wifi_password">Password</label>
                    </td>
                    <td>
                        <input type="password" id="wifi_password" name="wifi_password">
                    </td>
                </tr>
            </table>
        </fieldset>
        <fieldset>
            <legend>MQTT Settings</legend>
            <table>
                <tr>
                    <td>
                        <label for="mqtt_host">Broker Hostname</label>
                    </td>
                    <td>
                        <input type="text" id="mqtt_host" name="mqtt_host">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="mqtt_user">User</label>
                    </td>
                    <td>
                        <input type="text" id="mqtt_user" name="mqtt_user">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="mqtt_password">Password</label>
                    </td>
                    <td>
                        <input type="password" id="mqtt_password" name="mqtt_password">
                    </td>
                </tr>
            </table>
        </fieldset>
        <div class="center">
            <button type="submit">Save</button>
        </div>
    </form>
</body>
</html>
