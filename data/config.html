<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Module Configurator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .center {
            display: flex;
            justify-content: center;
        }
        label, button {
            cursor: pointer;
        }
        .form-field {
            display: flex;
            flex-direction: column;
        }
        .form-field > input {
            height: 2rem;
            font-size: 1.2em;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        button {
            height: 2rem;
            width: 100%;
        }
    </style>
</head>
<body>
    <form action="/" method="post">
        <fieldset class="form-group">
            <legend>WiFi Settings</legend>
            <div class="form-field">
                <label for="wifi_host">Hostname</label>
                <input type="text" id="wifi_host" name="wifi_host" value="%wifi_host%">
            </div>
            <div class="form-field">
                <label for="wifi_ssid">SSID</label>
                <input type="text" id="wifi_ssid" name="wifi_ssid" value="%wifi_ssid%">
            </div>
            <div class="form-field">
                <label for="wifi_password">Password</label>
                <input type="password" id="wifi_password" name="wifi_password">
            </div>
        </fieldset>
        <fieldset class="form-group">
            <legend>MQTT Settings</legend>
            <div class="form-field">
                <label for="mqtt_host">Broker Hostname</label>
                <input type="text" id="mqtt_host" name="mqtt_host" value="%mqtt_host%">
            </div>
            <div class="form-field">
                <label for="mqtt_user">User</label>
                <input type="text" id="mqtt_user" name="mqtt_user" value="%mqtt_user%">
            </div>
            <div class="form-field">
                <label for="mqtt_password">Password</label>
                <input type="password" id="mqtt_password" name="mqtt_password">
            </div>
        </fieldset>
        <div class="center">
            <button type="submit">Save</button>
        </div>
    </form>
</body>
</html>
